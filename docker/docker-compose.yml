# Reusa o 9Router já rodando no stack do rag-knowledge-assistant nesta
# mesma VPS (ver design.md Context) — não redefine esse serviço aqui.
# LLM_BASE_URL no .env deve apontar pro Tailscale IP existente
# (http://<TAILSCALE_9ROUTER_IP>:20128/v1).
#
# `name` explícito: sem isso, o Compose deriva o nome do projeto do nome
# da pasta que contém este arquivo ("docker") — igual à pasta
# rag-knowledge-assistant/docker/. As duas stacks acabavam sendo tratadas
# como UM ÚNICO projeto Compose ("docker") na mesma VPS, o que faz
# `docker compose down --remove-orphans` aqui enxergar os containers do
# rag-knowledge-assistant como "órfãos" e apagá-los. Nunca remova este
# campo.
name: newsletter-website

services:
  newsletter_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: newsletter_api
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ../.env
    volumes:
      - newsletter_data:/app/data
    restart: unless-stopped

volumes:
  newsletter_data:
