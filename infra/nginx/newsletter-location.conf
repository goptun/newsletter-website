# Newsletter subscription/review API — proxied to the newsletter_api
# container (127.0.0.1:8001). Mirrors the /projects/rag/ prefix-stripping
# pattern already in use at
# portfolio-website/infra/nginx/matheusramos.dev.conf (see that file for
# the full server block this snippet must be merged into).
#
# This file lives in the newsletter-website repo because the API is owned
# here, but the matheusramos.dev server block itself is defined and
# deployed from the portfolio-website repo (a separate git repository —
# see DEPLOY.md "Nginx" section). Merge these two location blocks into
# that repo's infra/nginx/matheusramos.dev.conf, inside the existing
# `server { listen 443 ssl; server_name matheusramos.dev; ... }` block,
# then follow that repo's own "Updating the Nginx config" deploy steps
# (which already run `nginx -t` before reloading).

location = /api/newsletter {
    return 301 /api/newsletter/;
}

location /api/newsletter/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
